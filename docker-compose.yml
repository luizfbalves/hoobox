name: hoobox

services:
  mysql:
    image: mysql:8.4
    container_name: hoobox-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hoobox
    volumes:
      - hoobox_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: hoobox-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: hoobox-api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/hoobox
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3333"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      JWT_SECRET: dev-secret-troque-em-producao
      JWT_EXPIRES_IN_SECONDS: "3600"
      LOG_LEVEL: info
      OUTBOX_POLL_MS: "500"
      OUTBOX_PUBLISH_TIMEOUT_MS: "5000"
      ORDER_WORKER_CONCURRENCY: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  hoobox_mysql_data:
